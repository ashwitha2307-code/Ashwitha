<!DOCTYPE html>
<html>
<head>
    <title>Student Marks Calculator</title>
</head>

<body>

    <h1>Student Marks Calculator</h1>

    <label>Subject 1 Marks:</label>
    <input type="number" id="mark1">
    <br><br>

    <label>Subject 2 Marks:</label>
    <input type="number" id="mark2">
    <br><br>

    <label>Subject 3 Marks:</label>
    <input type="number" id="mark3">
    <br><br>

    <button onclick="calculateMarks()">Calculate</button>

    <h2 id="result"></h2>

    <script>
        function calculateMarks() {
            let m1 = Number(document.getElementById("mark1").value);
            let m2 = Number(document.getElementById("mark2").value);
            let m3 = Number(document.getElementById("mark3").value);

            let total = m1 + m2 + m3;
            let percentage = (total / 300) * 100;

            document.getElementById("result").innerHTML =
                "Total Marks: " + total +
                "<br>Percentage: " + percentage.toFixed(2) + "%";
        }
    </script>

</body>
</html>
